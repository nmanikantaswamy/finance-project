server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://mysql-user:3306/finance_user_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://discovery-server:8761/eureka

  instance:
    prefer-ip-address: true

jwt:
  secret: "finance-project-super-secret-key-2026-this-must-be-long"
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: "*"