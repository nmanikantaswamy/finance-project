
services:

  # =========================================================
  # MYSQL DATABASES
  # =========================================================
  mysql-user:
    image: mysql:8.4
    container_name: mysql-user
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: finance_user_db
    ports:
      - "3311:3306"
    volumes:
      - mysql-user-data:/var/lib/mysql
    networks:
      - finance-network

  mysql-account:
    image: mysql:8.4
    container_name: mysql-account
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: account_db
    ports:
      - "3307:3306"
    volumes:
      - mysql-account-data:/var/lib/mysql
    networks:
      - finance-network

  mysql-transaction:
    image: mysql:8.4
    container_name: mysql-transaction
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: transaction_db
    ports:
      - "3308:3306"
    volumes:
      - mysql-transaction-data:/var/lib/mysql
    networks:
      - finance-network

  mysql-audit:
    image: mysql:8.4
    container_name: mysql-audit
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: audit_db
    ports:
      - "3309:3306"
    volumes:
      - mysql-audit-data:/var/lib/mysql
    networks:
      - finance-network

  mysql-reporting:
    image: mysql:8.4
    container_name: mysql-reporting
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: reporting_db
    ports:
      - "3310:3306"
    volumes:
      - mysql-reporting-data:/var/lib/mysql
    networks:
      - finance-network


  # =========================================================
  # KAFKA
  # =========================================================

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    volumes:
      - kafka-data:/var/lib/kafka/data

    networks:
      - finance-network


  # =========================================================
  # CONFIG SERVER
  # =========================================================

  config-server:
    build:
      context: ../config-server
    container_name: config-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8888:8888"
    networks:
      - finance-network


  # =========================================================
  # DISCOVERY SERVER
  # =========================================================

  discovery-server:
    build:
      context: ../discovery-server
    container_name: discovery-server
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    networks:
      - finance-network


  # =========================================================
  # API GATEWAY
  # =========================================================

  api-gateway:
    build:
      context: ../api-gateway
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    depends_on:
      - config-server
      - discovery-server
    networks:
      - finance-network

  # =========================================================
  # USER SERVICE
  # =========================================================
  user-service:
    build:
      context: ../user-service
    container_name: user-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8081:8081"
    depends_on:
      - config-server
      - discovery-server
      - mysql-user
    networks:
      - finance-network
  # =========================================================
  # ACCOUNT SERVICE
  # =========================================================

  account-service:
    build:
      context: ../account-service
    container_name: account-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8082:8082"
    depends_on:
      - config-server
      - discovery-server
      - mysql-account
    networks:
      - finance-network


  # =========================================================
  # TRANSACTION SERVICE
  # =========================================================

  transaction-service:
    build:
      context: ../transaction-service
    container_name: transaction-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8083:8083"
    depends_on:
      - config-server
      - discovery-server
      - mysql-transaction
      - kafka
      - account-service
    networks:
      - finance-network


  # =========================================================
  # NOTIFICATION SERVICE
  # =========================================================

  notification-service:
    build:
      context: ../notification-service
    container_name: notification-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8084:8084"
    depends_on:
      - config-server
      - discovery-server
      - kafka
    networks:
      - finance-network


  # =========================================================
  # AUDIT SERVICE
  # =========================================================

  audit-service:
    build:
      context: ../audit-service
    container_name: audit-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8085:8085"
    depends_on:
      - config-server
      - discovery-server
      - kafka
      - mysql-audit
    networks:
      - finance-network


  # =========================================================
  # REPORTING SERVICE
  # =========================================================

  reporting-service:
    build:
      context: ../reporting-service
    container_name: reporting-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8086:8086"
    depends_on:
      - config-server
      - discovery-server
      - kafka
      - mysql-reporting
    networks:
      - finance-network


# =========================================================
# VOLUMES
# =========================================================

volumes:

  mysql-user-data:
  mysql-account-data:
  mysql-transaction-data:
  mysql-audit-data:
  mysql-reporting-data:
  kafka-data:


# =========================================================
# NETWORK
# =========================================================

networks:

  finance-network:
    driver: bridge